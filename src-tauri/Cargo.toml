[package]
name = "qdlp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qdlp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
futures = "0.3"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-dialog = "2.7.2"

[dev-dependencies]
# Deliberately not tokio, matching rustyDLP's own invariant test: the domain
# layer's futures must stay runtime-agnostic. (Tauri itself uses tokio
# internally for the async commands below, which is a separate concern.)
pollster = "0.4"

